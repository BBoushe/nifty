# Parallel GitLab CI/CD pipeline mirroring .github/workflows/ci.yml (Decision 1.7)
# Active automatically when the repository is hosted on GitLab (GIT_FORGE=gitlab).

stages:
  - verify
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "alpha" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "alpha" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'

# Runner tags from the FH Dortmund GitLab: untagged jobs stay "pending, stuck" there.
default:
  tags:
    - docker
    - dind

backend:
  stage: verify
  image: eclipse-temurin:21-jdk
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw -B test

frontend:
  stage: verify
  image: node:22-alpine
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm run lint
    - npm run build

harness-tests:
  stage: verify
  image: node:22-alpine
  script:
    - node --test .claude/hooks/hooks.test.mjs scripts/harness-scripts.test.mjs

conventional-commits:
  stage: verify
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          COMMITS="$(git rev-list "${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}")"
        else
          git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
          COMMITS="$(git rev-list "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..${CI_COMMIT_SHA}")"
        fi
      else
        BEFORE="${CI_COMMIT_BEFORE_SHA:-0000000000000000000000000000000000000000}"
        if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
          COMMITS="$(git rev-list --max-count=20 "$CI_COMMIT_SHA")"
        else
          COMMITS="$(git rev-list "${BEFORE}..${CI_COMMIT_SHA}")"
        fi
      fi

      PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix)(\([a-z0-9._/-]+\))?!?: .+'
      FAILED=0
      for sha in $COMMITS; do
        [ -z "$sha" ] && continue
        subject="$(git show -s --format=%s "$sha")"
        case "$subject" in
          "Merge "*|"Revert "*) continue ;;
        esac
        if ! printf '%s\n' "$subject" | grep -Eq "$PATTERN"; then
          echo "ERROR: Non-conventional commit ${sha}: ${subject}" >&2
          FAILED=1
        fi
      done
      exit "$FAILED"

branch-policy:
  stage: verify
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        BASE="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        HEAD="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        if [ "$BASE" = "main" ] || [ "$BASE" = "master" ]; then
          if [ "$HEAD" != "alpha" ]; then
            echo "ERROR: Merge requests into '${BASE}' must come from 'alpha' (received '${HEAD}')." >&2
            exit 1
          fi
        elif [ "$BASE" = "alpha" ]; then
          if [ "$HEAD" != "dev" ]; then
            echo "ERROR: Merge requests into 'alpha' must come from 'dev' (received '${HEAD}')." >&2
            exit 1
          fi
        fi
        echo "OK: MR promotion ${HEAD} -> ${BASE} is valid."
        exit 0
      fi

      if [ "${CI_PIPELINE_SOURCE:-}" = "push" ] && [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        BEFORE="${CI_COMMIT_BEFORE_SHA:-0000000000000000000000000000000000000000}"
        if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
          echo "Initial push to dev; skipping direct-push check."
          exit 0
        fi
        PARENTS="$(git show -s --format=%P "$CI_COMMIT_SHA" | wc -w | tr -d ' ')"
        if [ "$PARENTS" -ge 2 ]; then
          echo "OK: Push to dev originates from a merged Merge Request."
          exit 0
        fi
        FAILED=0
        for sha in $(git rev-list "${BEFORE}..${CI_COMMIT_SHA}"); do
          subject="$(git show -s --format=%s "$sha")"
          if ! printf '%s\n' "$subject" | grep -Eq '^(docs|hotfix)(\([a-z0-9._/-]+\))?!?: '; then
            echo "ERROR: Direct push to 'dev' blocked — commit ${sha} ('${subject}') is not 'docs:' or 'hotfix:'." >&2
            FAILED=1
          fi
        done
        exit "$FAILED"
      fi

# Smoke-build both images with their own multi-stage Dockerfiles (they compile inside Docker,
# so no jar/dist hand-off from the verify jobs). Needs a privileged runner for docker:dind.
.docker-build:
  stage: package
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - docker info

backend-image:
  extends: .docker-build
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" backend

frontend-image:
  extends: .docker-build
  script:
    - docker build --pull --target prod -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" frontend
