spring:
  application:
    name: nifty-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nifty}
    username: ${SPRING_DATASOURCE_USERNAME:nifty}
    password: ${SPRING_DATASOURCE_PASSWORD:nifty_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Provider-agnostic / EU-ready Spring AI 2.0 configuration.
  # Boots cleanly with placeholder values before an API key is supplied.
  ai:
    openai:
      api-key: ${AI_API_KEY:not-configured}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}

nifty:
  ai:
    provider-mode: ${AI_PROVIDER_MODE:placeholder}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
