name: CI

on:
  pull_request:
    branches: [dev, alpha, main, master]
  push:
    branches: [dev, alpha, main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 & Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw -B test

  frontend:
    name: Frontend (Vue 3.5 & Vite 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi

          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix)(\([a-z0-9._/-]+\))?!?: .+'
          FAILED=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git show -s --format=%s "$sha")"
            if [[ "$subject" == Merge\ * || "$subject" == Revert\ * ]]; then
              continue
            fi
            if ! printf '%s\n' "$subject" | grep -Eq "$PATTERN"; then
              echo "::error::Non-conventional commit ${sha}: ${subject}"
              FAILED=1
            fi
          done < <(git rev-list "$RANGE")

          exit "$FAILED"

  branch-policy:
    name: Branch Promotion Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PR promotion path (dev -> alpha -> master/main)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          if [[ "$BASE" == "main" || "$BASE" == "master" ]]; then
            if [[ "$HEAD" != "alpha" ]]; then
              echo "::error::Pull requests into '${BASE}' must come from 'alpha' (received '${HEAD}')."
              exit 1
            fi
          elif [[ "$BASE" == "alpha" ]]; then
            if [[ "$HEAD" != "dev" ]]; then
              echo "::error::Pull requests into 'alpha' must come from 'dev' (received '${HEAD}')."
              exit 1
            fi
          fi
          echo "OK: PR promotion ${HEAD} -> ${BASE} is valid."

      - name: Enforce docs/hotfix-only direct push policy on dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push to dev; skipping direct-push diff check."
            exit 0
          fi

          # Check if the head commit is a PR merge commit (2+ parents) or a squash/rebase from PR
          PARENTS="$(git show -s --format=%P "${{ github.sha }}" | wc -w | tr -d ' ')"
          HEAD_SUBJECT="$(git show -s --format=%s "${{ github.sha }}")"
          if [ "$PARENTS" -ge 2 ] || printf '%s\n' "$HEAD_SUBJECT" | grep -Eq '\(#[0-9]+\)$'; then
            echo "OK: Push to dev originates from a merged Pull Request."
            exit 0
          fi

          FAILED=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git show -s --format=%s "$sha")"
            if ! printf '%s\n' "$subject" | grep -Eq '^(docs|hotfix)(\([a-z0-9._/-]+\))?!?: '; then
              echo "::error::Direct push to 'dev' blocked by policy — commit ${sha} ('${subject}') is not prefixed with 'docs:' or 'hotfix:'. Open a PR from a feature branch instead."
              FAILED=1
            fi
          done < <(git rev-list "${BEFORE}..${{ github.sha }}")

          exit "$FAILED"
