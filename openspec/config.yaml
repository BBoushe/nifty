schema: spec-driven

context: |
  Project: Evidence-First Skill Assessment Platform (FH Dortmund Block Week, 5-person team).
  Source of truth for product vision: docs/discovery-canvas.md.

  Mandatory Tech Stack:
  - Backend: Java 21, Spring Boot 4.x, Spring Security (2 roles: PROFESSOR/REVIEWER, CANDIDATE),
    Spring Web (SSE streaming), Spring Data JPA, Spring AI 2.0, Timefold Solver, PostgreSQL (JSONB
    for assessment-transcript/v1), Flyway migrations, springdoc-openapi, JUnit 5, Mockito, Testcontainers.
  - Frontend: Vue 3.5 (stable — DO NOT upgrade to 3.6 RC), TypeScript, Vite 8, Vue Router, Pinia,
    TanStack Query (Vue), Tailwind CSS v4, Apache ECharts (vue-echarts). UI kit (PrimeVue vs. shadcn-vue) TBD.
  - Cross-platform: All workflows, scripts, and Docker setups must work on macOS, Windows, and Linux.

  Non-Negotiable Domain & Regulatory Invariants:
  - Deterministic math only: LLMs MUST NEVER calculate totals, rankings, cohort statistics, or team-balance numbers.
  - Explicit N/A: Skills with zero verified evidence MUST be scored as N/A (never 0 or 1) and excluded from fit.
  - Verbatim quotes: Every extracted quote MUST appear word-for-word in its referenced transcript entry or be discarded.
  - Calculated confidence: Confidence (0..1) is computed deterministically from measurable signals, never LLM self-report.
  - EU AI Act (Annex III) & GDPR human-in-the-loop: A human MUST approve configurations, flagged/final scores,
    and team placements. Every override requires a reason and writes an immutable audit log entry.
  - Candidate transparency: Formula, weights, and verified evidence are revealed to the candidate only AFTER approval.
  - Privacy & security: Prefer EU-hosted LLM endpoints; never commit secrets or real PII transcripts.

rules:
  proposal:
    - State clear scope, out-of-scope items, and link to relevant sections of docs/discovery-canvas.md.
    - Keep proposals concise and reviewable in under 2 minutes.
  specs:
    - Write all functional and non-functional acceptance criteria in EARS notation
      (WHEN / WHILE / WHERE / IF...THEN / THE SYSTEM SHALL).
    - Explicitly state deterministic vs. LLM responsibilities and human-in-the-loop gates.
  design:
    - Specify PostgreSQL/Flyway schema changes, REST/SSE/OpenAPI contracts, and deterministic validation boundaries.
    - Respect assessment-transcript/v1 JSON Schema for any transcript interaction.
  tasks:
    - Break work into small, verifiable tasks with explicit test or verification commands.
    - Mark tasks complete only after running and observing passing exit codes.

operations:
  apply:
    guidance:
      - "Implement one logical milestone at a time and use Conventional Commits."
      - "Never skip verification — run real Maven, npm, and Docker checks before marking tasks done."
  archive:
    guidance:
      - "Sync updated domain requirements into openspec/specs/<module>/spec.md before archiving."
